<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>下一站天后！跟著媽祖遊馬祖｜活動攻略與規則</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #027a9e;
      --primary-dark: #005670;
      --primary-light: #e6f4f8;
      --accent-orange: #ef7d19;
      --accent-red: #d94b4b;
      --accent-green: #2fa360;
      --text-main: #23353e;
      --text-muted: #5e737e;
      --bg-light: #f4f8fa;
      --card-bg: #ffffff;
      --border-color: #d8e5ea;
      --radius: 14px;
      --shadow: 0 8px 24px rgba(2, 122, 158, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-light);
      color: var(--text-main);
      line-height: 1.65;
      padding-bottom: 70px;
    }

    /* 頂部主視覺 Banner 區域 */
    .hero-banner {
      width: 100%;
      background-color: #559db8;
      line-height: 0;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .hero-banner img {
      width: 100%;
      max-width: 960px;
      height: auto;
      display: inline-block;
      vertical-align: middle;
    }

    /* 導言說明區 */
    .intro-section {
      text-align: center;
      padding: 28px 20px 10px;
    }
    .badge {
      display: inline-block;
      background: var(--accent-orange);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 50px;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }
    .intro-section h1 {
      font-size: 1.75rem;
      font-weight: 900;
      color: var(--primary-dark);
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .intro-section p {
      font-size: 0.95rem;
      color: var(--text-muted);
      max-width: 620px;
      margin: 0 auto;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* 即時庫存監控看板 (Live Stock Board) */
    .stock-board {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin: 20px 0 24px;
    }
    .stock-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid #eef3f6;
      padding-bottom: 10px;
    }
    .stock-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary-dark);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .live-dot {
      width: 10px;
      height: 10px;
      background-color: var(--accent-green);
      border-radius: 50%;
      display: inline-block;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(47, 163, 96, 0.6); }
      70% { box-shadow: 0 0 0 8px rgba(47, 163, 96, 0); }
      100% { box-shadow: 0 0 0 0 rgba(47, 163, 96, 0); }
    }
    .stock-update-time {
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    .stock-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
    }
    .stock-card {
      background: var(--bg-light);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      border: 1px solid #e3edf2;
    }
    .stock-item-name {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .stock-val {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--primary);
    }
    .stock-val.low {
      color: var(--accent-red);
    }
    .stock-desc {
      font-size: 0.75rem;
      color: #889ba6;
      margin-top: 4px;
    }

    /* 交通航班快捷按鈕區 */
    .traffic-links {
      background: #eef7fa;
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 24px;
      border: 1px dashed #b9d8e4;
    }
    .traffic-links h3 {
      font-size: 0.98rem;
      color: var(--primary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
    }
    .btn-traffic {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      background: #ffffff;
      color: var(--primary-dark);
      border: 1px solid #c9dfe8;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .btn-traffic:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    /* 重要提醒 Callout */
    .callout-box {
      background: #fff8eb;
      border-left: 5px solid var(--accent-orange);
      padding: 18px 20px;
      border-radius: 10px;
      margin-bottom: 24px;
      box-shadow: 0 3px 10px rgba(239, 125, 25, 0.08);
    }
    .callout-title {
      font-weight: 700;
      color: #b75900;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 1.02rem;
    }
    .callout-box ul {
      padding-left: 20px;
      color: #5d452d;
      font-size: 0.92rem;
    }
    .callout-box li { margin-bottom: 4px; }

    /* 摘要對照表 */
    .table-container {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 24px;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.92rem;
    }
    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-color);
    }
    th {
      background-color: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
      white-space: nowrap;
    }
    tr:last-child td { border-bottom: none; }

    /* Tab 切換器 */
    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 6px;
    }
    .tab-btn {
      flex: 1;
      min-width: 115px;
      background: #e2edf1;
      border: none;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.25s ease;
      text-align: center;
      white-space: nowrap;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 12px rgba(2, 122, 158, 0.25);
    }

    /* 活動卡片 */
    .tab-content { display: none; }
    .tab-content.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
      border: 1px solid var(--border-color);
    }
    .card h2 {
      font-size: 1.35rem;
      color: var(--primary);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-item {
      display: flex;
      gap: 14px;
      margin-bottom: 18px;
    }
    .step-num {
      width: 28px;
      height: 28px;
      background: var(--accent-orange);
      color: white;
      font-weight: 900;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 0.85rem;
      margin-top: 2px;
    }
    .step-body h4 {
      font-size: 1.02rem;
      margin-bottom: 4px;
      color: var(--text-main);
    }
    .step-body p {
      font-size: 0.92rem;
      color: var(--text-muted);
    }

    .grid-preview {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin: 14px 0;
      background: #edf5f8;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      text-align: center;
      font-weight: 500;
    }
    .grid-cell {
      background: white;
      padding: 10px 4px;
      border-radius: 6px;
      border: 1px solid #d2e4ea;
    }

    /* ========================================================
       【合作特約店家專區：民眾純瀏覽介面】
       ======================================================== */
    .partners-section {
      margin: 36px 0 24px;
    }
    .partners-header-bar {
      margin-bottom: 16px;
    }
    .partners-title-group h2 {
      font-size: 1.35rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .partners-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .island-filter-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .island-btn {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background: #ffffff;
      color: var(--text-main);
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .island-btn.active {
      background: var(--primary-dark);
      color: #fff;
      border-color: var(--primary-dark);
      box-shadow: 0 2px 8px rgba(0, 86, 112, 0.25);
    }

    .filter-controls-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .search-box-wrap {
      flex: 1;
      min-width: 200px;
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 10px 14px 10px 36px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
      background: #fff;
      transition: border-color 0.2s;
    }
    .search-input:focus {
      border-color: var(--primary);
    }
    .search-icon-svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.9rem;
      color: #889ba6;
    }
    .type-select-wrap select {
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 0.9rem;
      background: #fff;
      color: var(--text-main);
      outline: none;
      cursor: pointer;
    }

    .store-grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .store-card {
      background: #ffffff;
      border: 1px solid #e3edf2;
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .store-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(2, 122, 158, 0.08);
      border-color: #c9dfe8;
    }
    .store-name-text {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px
